name: smoke

# A real Android emulator plays the app like a child against a FAKE backend that records every request. It takes about
# 20 minutes, so it runs only on a commit whose message contains [smoke] (or by hand), never on every push.
on:
  push:
    branches: [main, "feat/**", "ci/**"]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walkthrough:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The only build that knows the fake server: BuildConfig.SMOKE_BACKEND is empty in every other build.
      - name: Debug APK that talks to the fake server
        run: |
          ./gradlew assembleDebug -PsmokeBackend=10.0.2.2:8787
          mkdir -p apk && cp app/build/outputs/apk/debug/*.apk apk/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # ReactiveCircus/android-emulator-runner (vetted for PAGEL 2026-10-27).
      - name: Emulator walkthrough (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 576M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/walkthrough.sh
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-evidence
          path: smoke-out/
          retention-days: 7
