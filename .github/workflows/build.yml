name: build

# The laptop's disk is nearly full and the Oracle server is ARM, so CI is where the native app compiles and is judged
# (copied from PAGEL's build.yml, 2026-10-28).
on:
  pull_request:
  push:
    branches: [main, "feat/**", "ci/**"]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Leak scan (public repo, file names only)
        run: bash scripts/leak-scan.sh all
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # roborazzi.test.record: the screenshot tests save their PNGs (app/build/outputs/roborazzi) for the artifact.
      - name: Unit tests, screenshot tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug -Proborazzi.test.record=true
      # Brilliant's sounds are debug-only (Boss, 2026-10-31): only the debug source set may hold them, the debug APK has them,
      # and the release workflow checks its own merged assets (a release build here would need the Firebase file).
      - name: Sounds ship in the debug build only
        run: |
          stray=$(find app/src -type f \( -name '*.mp3' -o -name '*.ogg' -o -name '*.wav' \) -not -path 'app/src/debug/assets/sounds/*' -not -path 'app/src/main/assets/voice/*')
          [ -z "$stray" ] || { echo "sound files outside the allowed folders: $stray"; exit 1; }
          unzip -l app/build/outputs/apk/debug/*.apk | grep -q 'assets/sounds/correct.mp3' || { echo "the debug APK lost its sounds"; exit 1; }
      # No cut text, no red, no emoji: one script lists every finding (Boss, 2026-10-31).
      - name: Screen checks (cut text, red, emoji)
        if: always()
        run: |
          python3 -m pip install --quiet pillow numpy
          python3 .github/scripts/screen-checks.py --self-test
          python3 .github/scripts/screen-checks.py
      - name: Keep the screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-and-reports
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
      # The lesson's own pictures (round 6) on their own, small enough to download in a minute; the matrix of every screen is the big one above.
      - name: Keep the lesson pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-pictures
          path: |
            app/build/outputs/roborazzi/round6/
            app/build/outputs/roborazzi/lesson/
            app/build/outputs/roborazzi/phones/
            app/build/outputs/roborazzi/track/
            app/build/outputs/roborazzi/pill/
            app/build/outputs/roborazzi/motion/
            app/build/outputs/roborazzi/checks/
          retention-days: 7
      - name: Keep the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: humopedia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
